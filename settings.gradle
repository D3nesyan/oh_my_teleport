pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Lets Gradle download a JDK 25 toolchain automatically, since Minecraft 26.x
	// requires Java 25 and the local machine may only have an older JDK.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'oh_my_teleport'
